ce"}, "camp": {"s": "img-22324cfa.jpg", "a": "Schoolchildren in blue uniforms standing in a grassy field at Nature Camp, a boy in a navy sweater raising binoculars to his eyes while classmates behind him look at their notes"}, "nc1": {"s": "img-eff9913d.jpg", "a": "Dozens of schoolchildren in blue uniforms spread across a green floodplain beside a lake, some walking, others gathered in a circle around a teacher"}, "nc2": {"s": "img-574f3ee5.jpg", "a": "A child kneeling in the grass cups both hands around a tiny green frog"}, "nc3": {"s": "img-010446a7.jpg", "a": "Two girls in school uniform at Nature Camp, one raising binoculars to her eyes while the other reads a checklist on a yellow clipboard"}, "nc4": {"s": "img-682c632a.jpg", "a": "A tiny green frog perched on a red sleeve, with a child blurred in the background against sky and grass"}, "nc5": {"s": "img-8799121a.jpg", "a": "Two cupped hands holding a small black and yellow striped insect on a fingertip, against soft green"}, "cchero": {"s": "img-ea505b28.jpg", "a": "Extreme close-up of a chimpanzee\u2019s face in profile, with deep-set amber eyes and weathered skin against soft green blur"}, "cc1": {"s": "img-f7bc81ce.jpg", "a": "Young people in bibs play hockey on a dusty clearing ringed by tall trees, with cones scattered across the ground"}, "cc2": {"s": "img-25af3560.jpg", "a": "A tight crowd of cattle of many colours and horn shapes, seen from above, some wearing yellow ear tags"}, "cc3": {"s": "img-d631f820.jpg", "a": "A health worker in white holds an awareness poster while three seated community members listen outside a house"}, "cc4": {"s": "img-966d16da.jpg", "a": "Two men lift a bicycle onto a vehicle roof rack on a dusty forest road in low evening light"}, "cc5": {"s": "img-27a32a28.jpg", "a": "A small lizard with a blue-patterned head climbing a rough, sunlit tree trunk with blue sky behind"}, "mh": {"s": "img-f684fcdd.jpg", "a": "A smiling schoolgirl holds a wooden geoboard with rubber bands forming a house shape beside her paper drawing of a house, in a busy classroom"}, "mm1": {"s": "img-fdd57bef.jpg", "a": "A large group of schoolchildren and visitors pose together outdoors under trees, many holding up wooden geoboards and paper drawings"}, "mm2": {"s": "img-a572dc31.jpg", "a": "Children kneel around a wooden board while a hand holds a blue nail clamp and another holds a hammer, with a child in a blue patterned dress in the foreground"}, "mm3": {"s": "img-33d31ec0.jpg", "a": "A classroom full of children at wooden desks drawing on paper, with two women bending to help and other children standing along the wall"}, "mm4": {"s": "img-5f4871ab.jpg", "a": "Overhead view of a school desk covered with wooden geoboards, rubber bands, dotted paper and pencils held in children\u2019s hands"}, "mm5": {"s": "img-5d1417ec.jpg", "a": "A woman kneels on a concrete floor with a hammer and nail clamp while children gather around a small board"}, "eyes": {"s": "img-e8d9ee9f.jpg", "a": "Extreme close-up of a person\u2019s eyes, one olive and one golden-green, with bands of warm sunlight and shadow falling across the face"}, "ms1": {"s": "img-70578024.jpg", "a": "Silhouetted schoolchildren seen from inside a bus, faces turned up toward a dusty window marked in red capital letters, with blurred trees behind"}, "ms2": {"s": "img-7131c4a9.jpg", "a": "A branch of deep red leaves hanging against a pure white sky"}, "ms3": {"s": "img-e75224fc.jpg", "a": "A child with glitter scattered across their face and red lips holds a green strap and looks into the camera"}, "ms4": {"s": "img-dc0af23c.jpg", "a": "The Milky Way across a dense field of stars, with a band of warm orange light at the right edge"}, "ms5": {"s": "img-fad7b548.jpg", "a": "A giraffe in black and white, in silhouette, stretching its neck up into thorny branches"}, "ms6": {"s": "img-31c64c60.jpg", "a": "Two small wooden boats, one with a standing figure poling, on calm gold-lit water off the Vilankulos shore on the Indian Ocean, with birds in a pale sky"}, "ms7": {"s": "img-2fc373ef.jpg", "a": "A honeybee feeding on a white and yellow flower against a soft green background"}, "ms8": {"s": "img-7519ff19.jpg", "a": "Two people paddle a green canoe along a still river beside a wall of leaning trees, their reflections in the water"}, "ms9": {"s": "img-5ab18161.jpg", "a": "A heap of dried maize cobs in cream and gold seen from above in strong sunlight"}, "ms10": {"s": "img-2ac3ddeb.jpg", "a": "A fish eagle perched at the top of a sunlit tree against a clear blue evening sky"}, "ms11": {"s": "img-5bcc2f50.jpg", "a": "Forested hillside meeting a vast turquoise lake along a diagonal shoreline"}, "grass": {"s": "img-4846eaf1.jpg", "a": "Looking up through tall grass seed heads, backlit and soft-focused against a clear blue sky"}, "begin": {"s": "img-48d8f175.jpg", "a": "Four people walk away from the camera along a narrow path through bright green grass and dense trees in dappled light"}, "residency": {"s": "img-417a4657.jpg", "a": "Looking up into the canopy of a baobab tree: a thick dark branch above, hanging fruit and sunlit leaves against a deep blue sky"}};

{s:'cape-maclear',g:G1,t:'Cape Maclear',loc:'Lake Malawi',mloc:'Cape Maclear',yr:'2024',dur:'One week',ctx:'Eco-tourism project',role:'Photography and writing',line:'Lake Malawi — The water knows your name',img:'cm',r:'16/9',txt:[],
 chapters:[{img:'lake',kicker:'Lake Malawi',title:'The Water Knows Your Name',txt:['There is a place where time loosens its grip, where the sun rises not to wake the day, but to warm the soul.','Cape Maclear, they call it that. But the lake calls it something softer. Something that ripples. Something that sings.']},
{img:'cm',light:1,op:'48% 90%',kicker:'Chembe',title:'A Gentle Place and Embrace',txt:['The air is light with breeze and perfumed with woodsmoke. The rhythm of the village Chembe moves slowly, gently, like the dugout canoes that float before the dawn.','Men paddle with reverence. Women sweep sand like prayer. Goats speak in bleats and bells. Children run with joy unfiltered, laughter trailing like kites.','Here, life is not measured in minutes, but in moments. The simmer of nsima. The echo of drums. The crushing of waves.']},
{img:'kids',op:'58% 80%',kicker:'Tenderness',title:'The wild is not always fierce',txt:['There is no rush here. Only ritual. Only the sacred dance of simplicity.','The boats return at dusk, heavy with fish and stories. Fires bloom along the shore. Conversations rise with the stars. And all the while, the lake breathes, a steady, ancient rhythm that asks for nothing but your attention.']},
{img:'isle',light:1,op:'70% 60%',kicker:'Belonging',title:'In Stillness',txt:['We didn’t come to take. We came to listen. And the lake, generous as always, made room for our silence.','In her stillness, we remembered what it feels like to trust the present. To be a guest of the earth, not just a visitor. Here, you don’t just arrive, you become part of the tide.']},
{img:'calm',op:'92% 70%',kicker:'Homecoming',title:'Some places don’t ask for you to come.',txt:['They wait for you to return.','Cape Maclear doesn’t shout. She doesn’t sell herself. She waits, for those who know how to see with more than eyes. For those who move slowly enough to hear a ripple speak. This is a place for returners, for rememberers, for those who still believe in the quiet magic of wild water.']}],
close:{head:'To the keepers of Cape Maclear, and the land the lake calls home.',txt:['Thank you for opening our hearts to the spirit of Lake Malawi, for showing us that depth is found not only in water, but in welcome. For reminding us that harmony lives in the hands of fishermen, in the laughter of children, in the slow preparation of food that nourishes more than hunger.','You’ve shown us that simplicity is not lack, but abundance, when rooted in respect. We came to witness, and we leave as students, fed by your warmth, and humbled by the way you live with, and not beside the lake. This place, the wisdom of stillness, and the community that lives in step with the wild.','May the ripples of your care reach far. May the stories you hold continue to shine like stars on the tide.'],end:'Gratitude flows where words cannot'}},
{s:'ila',g:G1,t:'Ila',loc:'Kafue National Park',mloc:'Ila',yr:'2024',dur:'Two days',ctx:'Research on sustainable tourism in luxury lodges',role:'Photography and writing',line:'',img:'ila',r:'16/9',txt:[],
 chapters:[{img:'tree',sm:1,op:'58% 50%',kicker:'Forest',title:'A Soft Place in the Wilderness',txt:['In the heart of Kafue National Park, Ila rests where the river curves and the trees speak in stillness.','The forest doesn’t perform, it simply is. And in that quiet, something ancient stirs.']},
{img:'dome',tr:1,flip:1,op:'20% 70%',kicker:'Luxury',title:'Comfort, Gently Grounded',txt:['The suites open to the sky, to the sound of elephants grazing nearby.','Canvas, wood, and warm air shape the space, not to escape nature, but to live inside it.']},
{img:'plate',light:1,deep:1,sm:1,flip:0,op:'48% 50%',kicker:'Flavors',title:'Served with Ceremony',txt:['The meals here taste like the land, fresh, thoughtful, full of care.','Fire-roasted, garden-grown. A table set beneath stars becomes its own kind of sanctuary.']},
{img:'ele',br:1,sm:1,flip:1,op:'45% 50%',kicker:'Untamed',title:'A Whispered Invitation',txt:['Life moves here in quiet majesty. Elephants, lions, antelope, and birds in flight, not staged, not summoned, just present.','Every footprint in the dust, a reminder: we are guests in their world.']},
{img:'jeep',sm:1,op:'15% 50%',kicker:'Gentle Ethics',title:'Whispers of Balance',txt:['Ila doesn’t shout its values, it lives them.','Solar power, local partnerships, electric game drives. Between indulgence and integrity, between taking and giving.']}],
close:{head:'To the keepers of Ila, and the land it calls home, thank you.',txt:['Thank you for opening your doors to the wind, the stories, and the silent grace of Kafue. For showing us that luxury and wilderness are not opposites, but reflections of one another when rooted in care.','We came to witness, and we leave inspired, by the elephants in the mist, the meals made with soul, and the philosophy that treads gently. This is the kind of place that reminds us why we do what we do: to seek, to listen, and to tell the wild’s truth with humility and wonder.','We look forward to the journeys ahead, the ones we walk together, and the ones the wind will carry.'],end:'With deep respect,'}},
{s:'inhambane',g:G1,t:'Inhambane',loc:'Tofo',mloc:'Tofo, Mozambique',yr:'2025',dur:'One week',ctx:'Mangrove and recycling project',role:'Photography and writing',line:'',img:'tide',r:'16/9',txt:[],
 chapters:[{img:'tide',br:1,light:1,flip:0,op:'40% 50%',kicker:'Inhambane',title:'Tide',txt:['On the shores of Tofo, the ocean carries its rhythm into every breath. Waves fold into the sand with patience, and the air tastes of salt and sunrise.','Here, time does not pass, it drifts, like the tide, steady and unhurried, where the sea teaches softness and the horizon stretches into forever. Here, mornings begin with the glow of first light rising over the water, and nights close beneath constellations that speak in silence.']},
{img:'huts',wide:1,sm:1,flip:1,op:'40% 50%',kicker:'Kumba',title:'A Sanctuary Shaped by Tide, Timber, and Sky',txt:['Built from wood, palm, and sand, the bungalows stand as if they have always belonged to this coastline.','Each space is simple yet full of presence, wide beds veiled in white nets, light spilling gently through woven textures, the sound of the sea a constant companion. The infinity pool gathers the sky and returns it to the ocean. The yoga deck opens to the horizon. Hammocks swing with the rhythm of the breeze.','Every corner of Kumba is shaped with intention, not to hide from the world, but to welcome it: the laughter of travelers, the call of seabirds, the quiet wisdom of waves meeting shore.']},
{img:'table',light:1,deep:1,sm:1,wide:1,flip:0,op:'65% 50%',kicker:'Nourishment',title:'Flavours of the Coastline',txt:['Meals at Kumba are crafted with care, where flavor and freshness meet the rhythm of the sea.','Bread arrives still warm from the oven, fruit carries the sweetness of the sun, and each plate feels like a conversation between earth and ocean. The restaurant faces the waves, so every breakfast, lunch, and dinner is seasoned with salt air and horizon views.','Coffee is strong, juices are alive with color, and cocktails slip into the evenings as the sky burns into gold. Food here is more than sustenance, it is part of the stillness, part of the gathering, a reminder that nourishment is not only for the body, but also for the spirit.']},
{img:'yoga',br:1,light:1,wrap:1,sm:1,flip:1,op:'50% 50%',kicker:'Rhythm',title:'The Breath of Tide & Balance of Body',txt:['The yoga deck rises above the sand, a place where the day begins with breath and the sun lifts slowly from the sea.','Movement flows with the tide, and stillness holds its own weight beneath the sky. Whether a first pose or a familiar practice, the space invites presence. The sound of waves becomes the soundtrack to balance, grounding each breath in something older than time.','Here, stillness and movement are not opposites, but companions, like the inhale and exhale, like the tide’s retreat and return.']},
{img:'prints',lt:1,flip:0,op:'50% 50%',kicker:'The Community',title:'Echoes of Warmth',txt:['Beyond the shoreline, life moves to its own rhythm. The market fills with color and chatter, children run barefoot through the sand, and the village carries the warmth of welcome in every smile.','The community of Tofo is woven into the spirit of Kumba, fishermen returning with the day’s catch, artisans shaping beauty from their hands, families carrying forward traditions that belong to both land and sea.','To meet the people of Tofo is to be reminded that community is the first sanctuary, and that belonging is always shared.']},
{img:'dhow',tr:1,lt:1,flip:1,op:'48% 50%',kicker:'The Ocean',title:'Eternal Horizon',txt:['The sea is constant. From dawn to dusk, its voice never leaves.','It holds the thrill of discovery, the shadow of a whale shark beneath the surface, the grace of manta rays gliding deep, the laughter of dolphins racing the tide. Surfers ride its restless energy, and children play where the waves fold gently into shore.','To sit at Kumba is to witness the ocean as teacher and companion. Its vastness is humbling, its rhythm eternal. The ocean is not just backdrop, it is the pulse of this place.']}],
close:{head:'Dear Keepers of Tide and Stillness, thank you.',txt:['For building not just with wood and palm, but with intention. For shaping a sanctuary where the ocean is not backdrop but heartbeat, where the sunrise is not spectacle but prayer. For holding space where travelers arrive as strangers and leave with a piece of the sea stitched into their spirit.','Thank you for the bread warm from the oven, for the quiet details that whisper care, for the hammocks that sway in rhythm with the wind. Thank you for creating a place where movement and stillness sit side by side, where nourishment is more than food, and rest is more than sleep.','Kumba is not simply a lodge. It is an offering, a reminder that beauty can be gentle, that luxury can be simple, that belonging can be found in sand and salt and sky. To keep Kumba is to keep something greater: a way of living in harmony with land, ocean, and community. And for that, we are grateful.','With respect,'],end:'To all who arrive, and all who will return'}},
{s:'sindabezi',g:G1,t:'Sindabezi',loc:'Zambezi River',mloc:'Sindabezi, Zambezi River',yr:'2025',dur:'One night',ctx:'Research on sustainable tourism in luxury lodges',role:'Photography and writing',line:'',img:'croc',r:'16/9',txt:[],
 chapters:[{img:'croc',light:1,deep:1,wide:1,sm:1,flip:0,op:'28% 50%',kicker:'Livingstone',title:'Nothing Asks to Be Extended',txt:['Everything is already enough.','Livingstone arrived first in motion, a place of streets and schedules, of passing through rather than settling, until a crossing gently shifted everything. A short drive, a small port, and then a boat moving away from certainty and toward water, where the pace changed without instruction.','Sindabezi does not announce itself or ask you to arrive differently. It allows the river to do what it has always done, shaping the day and night, shaping how people move, speak, and make space for one another. Meals came without urgency, rest followed easily, and conversations softened in their own time. Nothing demanded attention, yet everything felt considered. The Zambezi was not scenery but structure, defining how the island breathed.','Some places are remembered for what they show you, others for how they allow you to be. This was the latter.']},
{img:'isle2',br:1,light:1,deepr:1,sm:1,flip:1,op:'30% 40%',kicker:'Sindabezi',title:'Defined by the Zambezi',txt:['Sindabezi is met through water, and the meeting is gentle. The river does not signal arrival, it settles you.','From the first moment on the island, the pace eases and attention softens, as if the place has been expecting you without anticipation. The Zambezi shapes the light, the sound, and the space between moments, creating an environment that feels composed rather than constructed.','Nothing here asks to be rushed or performed. The island holds a quiet confidence, allowing rest to come naturally and presence to follow. The river is not a view to be admired, but a constant alongside you, defining how the place feels before it is understood.']},
{img:'bed',light:1,deep:1,sm:1,wide:1,flip:0,op:'50% 50%',kicker:'A Night',title:'Where Rest Comes Easily',txt:['At Sindabezi, rest is not something you work toward. It meets you.','The rhythm of the island makes room for it, guided by people who understand when to step forward and when to give space. Evenings settle without ceremony. Sleep arrives deeply and without interruption. There is a sense of being quietly looked after, not through instruction, but through attentiveness. Nothing here feels rushed or withheld.','The pace is steady, the care consistent, the atmosphere calm. Safety is not announced. It is felt in the way the day unfolds, in how night arrives, and in the ease with which the body lets go.']},
{img:'risotto',two:1,sm:1,lt:1,side:1,mob:1,flip:1,op:'50% 45%',kicker:'Zambezi Flavours',title:'Where the River<br>Seasons Every Plate',txt:['At Sindabezi, flavour is shaped by care.','Meals follow a thoughtful, farm-to-table philosophy, where ingredients are fresh, local, and prepared with attention to the people they are meant for. What arrives feels personal rather than produced, considered rather than arranged.','Food is made to nourish, not to impress, and carries a quiet sense of intention in every detail. Flavour here is not only tasted. It is felt in the way meals settle into the day, in the ease they bring to conversation, and in the knowledge that what you are eating has been prepared especially for you.']},
{img:'rhino',light:1,deep:1,two:1,sm:1,flip:0,op:'85% 50%',kicker:'What We Hold',title:'Responsibility &<br>Mindful Action',txt:['Care does not end at the water’s edge.','It moves outward into the wild spaces of safari, the living breath of Mosi-oa-Tunya, and the classrooms of nearby community schools. Conservation here is practiced as stewardship, a quiet commitment to protect what is shared and to nurture what is still becoming.','Every encounter, whether with land, wildlife, or people, is guided by responsibility, respect, and the belief that preserving the future begins with how we choose to act today.']}],
reflect:{lead:'Some places stay with you, not because of what they offer, but because of what they leave intact. Sindabezi lingers as a feeling rather than a memory.',body:['A way of moving more gently, of listening longer, of recognising that care can be quiet and still complete. Long after the river is out of sight, its rhythm remains, carried forward in how you rest, how you choose, and how you hold the world you return to.']},
close:{head:'To the keepers of Sindabezi,',txt:['There are places that impress, and there are places that listen. Sindabezi does the latter. It listens to the river, to time, to the quiet needs of those who arrive carrying more than luggage. What you have made is not simply a place to stay, but a way to be held without being asked to explain yourself.','Nothing here feels excessive, yet nothing is missing. Care is present in the pauses, in the way food is offered, in the rhythm of rest, in the gentle confidence with which the island exists as itself. It is clear that Sindabezi is not managed against nature, but in conversation with it. The Zambezi is not framed. It is trusted. And because of that, so are we.','Your stewardship extends beyond comfort. It reaches into community, into conservation, into the long view of what it means to protect without possessing. There is integrity in how quietly this is done. No spectacle. No performance. Just consistent, thoughtful action rooted in respect for land, water, and people.','I leave with less urgency than I arrived with. Less noise. More awareness. That is a rare gift. Thank you for guarding it so carefully, and for reminding those who pass through that preservation begins not with grand gestures, but with daily choices made well.'],end:'With gratitude,'}},

'about':()=>({t:'About — Alexander Milambo',h:`<section class="sec"><h1 style="font-size:clamp(3rem,8vw,7rem);max-width:12ch">Curious about people and places.</h1></section>
<section class="sec" style="padding-top:0"><div class="two"><div class="a">${fig('me','Alexander Gift Milambo','5/4')}</div><div class="b">
<p>I’m a photographer, artist and creative strategist, and most of my work has grown out of being curious about people, places and the stories around them.</p>
<p>For the last three years I worked with a conservation organisation, and my role grew into quite a broad one. I was involved in shaping the organisation’s visual identity and communication, developing campaigns and stories, creating photography and content, working on design and digital platforms, and helping communicate the work happening across conservation and the surrounding communities. At Chimfunshi Wildlife Orphanage Trust, that work was in service of wildlife conservation, community development and sustainable agriculture.</p>
<p>I believe creativity is most meaningful when it helps people understand, appreciate and care about the world around them. My work explores the relationship between people, nature, education and culture through visual storytelling, strategic design and collaborative projects.</p>
<p>Whether I’m documenting wildlife conservation, developing educational experiences or building brand identities, I approach every project with curiosity, clarity and purpose.</p>
<h3 style="margin:48px 0 12px">Where the eye comes from</h3><p>Before photography there was painting. When art supplies became out of reach, a smartphone became the medium, and light became the material. That is where <a href="#/work/my-sight">My Sight</a> began.</p></div></div></section>
<section class="sec"><h2 style="margin-bottom:56px">What you can work with me on</h2>${tools()}<p style="margin-top:56px"><a class="btn" href="#/contact">Start a conversation</a></p></section>`}),
'think':()=>({t:'Think — Alexander Milambo',h:`<section class="sec"><p class="eyebrow">Think</p><h1 style="font-size:clamp(3rem,8vw,7rem)">Think</h1><p class="lede" style="margin-top:24px">Field notes on looking, on places, and on what work is for.</p></section>
<div class="notes">${[
['Drawing with light',['I came to photography by way of painting. When I could no longer afford art supplies, the only medium I had was a smartphone, so I began to draw with light.','I started treating the visible spectrum like a box of coloured pencils. That led me to colour grading, then to cinematography, and to a long look at how far a single colour can be toned. <a href="#/work/my-sight">My Sight</a> is where that practice lives.']],
['Field notes between people and place',['Every place leaves residue: a feeling that lingers longer than photographs or itineraries. I try to honour it through slow travel, observation and trust.','My destination work isn’t meant as a guide, but as an encounter. It’s a way of pausing long enough to feel the rhythm of a landscape, and to understand a place beyond surface and spectacle.']],
['Curiosity, clarity and purpose',['I believe creativity is most meaningful when it helps people understand, appreciate and care about the world around them.','For three years at Chimfunshi I advocated for wildlife conservation, community development and sustainable agriculture. The work was always about helping people understand why places and people matter. Whether I’m documenting wildlife conservation, developing an educational experience or building a brand identity, I begin with curiosity, aim for clarity, and keep asking what the work is for.']]

const closing=c=>`<section class="end" aria-labelledby="endh"><h2 id="endh" class="rv">${c.head}</h2><div class="t rv">${c.txt.map(x=>`<p>${x}</p>`).join('')}</div><p class="fin rv">${c.end}</p></section>`;
const proj=s=>{const p=by(s);if(!p)return R[''](); const wide=rv(p.r)>1.4;
 const meta=[['Location',p.mloc||p.loc],[p.yl||'Year',p.yr],['Duration',p.dur],['Role',p.role],['Context',p.ctx],['With',p.with],['Featured in',p.pub]].filter(x=>x[1]).map(x=>`<div><dt>${x[0]}</dt><dd>${x[1]}</dd></div>`).join('');
 const body=p.txt.map(x=>`<p>${x}</p>`).join(''),chs=p.chapters?p.chapters.map((c,i,arr)=>chap(c,i,arr.slice(0,i).filter(x=>x.txt).length)).join(''):'';
 const gal=p.gal?`<div class="gal">${p.gal.map(g=>`<div class="s${g[1]}">${fig(g[0],g[3],g[2])}</div>`).join('')}</div>`:'';
 if(p.notes)return notesPage(p,meta);
 if(p.chapters)return {t:`${p.t} — Alexander Milambo`,h:`<article class="sec story"><dl class="meta">${meta}</dl>${chs}${p.reflect?reflect(p.reflect):''}${p.close?closing(p.close):''}${trail(p)}</article>`};
 return {t:`${p.t} — Alexander Milambo`,h:`<article class="sec"><p class="note">${p.g}</p><h1 style="font-size:clamp(2.6rem,7vw,6rem);margin:12px 0 20px">${p.t}</h1>${p.line?`<p class="pull">${p.line}</p>`:''}<dl class="meta">${meta}</dl>
 ${wide?`<div class="full">${fig(p.img,'',p.r,1)}</div>${p.chapters?'':`<div class="two" style="margin-top:56px"><div class="a"></div><div class="b">${body}</div></div>`}${chs}`:`<div class="two"><div class="a">${fig(p.img,'',p.r,1)}</div><div class="b">${body}</div></div>`}
 ${gal}${trail(p)}</article>`}};

   Get a key at https://web3forms.com (enter Alexandergmila@gmail.com, the key arrives by email). Leave blank to fall back to the visitor's own email app. */
const ENDPOINT='https://api.web3forms.com/submit',ACCESS_KEY='865eb7dd-f308-4f33-98c8-cd78e975992e';
const WAYS=[
['Project','Pay for the work.','For defined creative engagements where the outcome and scope are relatively clear.','You know what you need. We build it together.',['Place photography','Film','Visual identity','Editorial','Campaigns','Creative direction','Brand or destination projects'],'Start a Project'],
['Partnership','Pay for ongoing creative capacity.','For organisations that need an external creative partner rather than a single production.','You know you need a creative perspective, but the work will evolve. A partnership gives you ongoing access to strategy, direction and production as priorities emerge. It is a flexible engagement, not a fixed list of deliverables.',['Creative strategy','Creative direction','Photography','Film','Design','Editorial','Campaign development','Content direction'],'Discuss a Partnership'],
['Residency','Pay for immersion.','Some places need more than a visit with a shot list. A residency gives us time to experience, observe and understand a place before deciding what needs to be created.','The length and format are shaped around the place and the project.',['Photography','Film','Written editorial','Visual archive','Campaign concepts','Creative recommendations','Brand observations','Other work that emerges naturally from the experience'],'Discuss a Residency']];
const STEPS=[['Enquire','Tell us what you’re trying to achieve.'],['Discover','We ask questions, listen and understand the context.'],['Define','We recommend the right creative approach.'],['Propose','We establish scope, timing and investment.'],['Create','We research, develop and produce.'],['Deliver','You receive the agreed work and creative assets.']];
const way=(w,i)=>`<section class="sec way w${i+1} ${i==2?'res':''}" aria-labelledby="w${i}"><div class="two rv"><div class="a"><span class="n" aria-hidden="true">0${i+1}</span><p class="eyebrow">${w[0]}</p><h2 id="w${i}">${w[1]}</h2></div><div class="b"><p class="lede">${w[2]}</p><p class="q">${w[3]}</p><ul class="cap" aria-label="What this can include">${w[4].map(x=>`<li>${x}</li>`).join('')}</ul><button type="button" class="lnk" data-way="${w[0]}">${w[5]} →</button></div></div>${i==2?`<div class="rv" style="margin-top:64px">${fig('residency','Place and time, left open on purpose.','21/9')}</div>`:''}</section>`;
const opt=(n,v)=>`<label class="opt"><input type="radio" name="${n}" value="${v}"><span>${v}</span></label>`;
const fld=(id,l,t,req,ex)=>`<div class="f"><label for="${id}">${l}${req?' *':''}</label><input type="${t||'text'}" id="${id}" name="${id}" ${req?`required aria-describedby="e-${id}"`:''} ${ex||''}>${req?`<p class="err" id="e-${id}" role="alert" hidden>${req}</p>`:''}</div>`;
const area=(id,l,req)=>`<div class="f full2"><label for="${id}">${l}${req?' *':''}</label><textarea id="${id}" name="${id}" ${req?`required aria-describedby="e-${id}"`:''}></textarea>${req?`<p class="err" id="e-${id}" role="alert" hidden>${req}</p>`:''}</div>`;
function enqRef(){const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789',a=new Uint8Array(4);crypto.getRandomValues(a);const t=new Date(),p=n=>String(n).padStart(2,'0');return 'AM-'+String(t.getFullYear()).slice(2)+p(t.getMonth()+1)+p(t.getDate())+'-'+[...a].map(x=>c[x%c.length]).join('')}
function enqText(d){return Object.entries(d).sort((a,b)=>(b[0]=='ref')-(a[0]=='ref')).filter(x=>x[1]).map(x=>(x[0]=='ref'?'Reference':x[0])+': '+x[1]).join('\n\n')}
async function sendEnquiry(d){
 if(!ENDPOINT||!ACCESS_KEY)return false;
 const p=Object.assign({access_key:ACCESS_KEY,subject:'Portfolio enquiry '+d.ref+' from '+d.name,from_name:'Alexander Milambo Portfolio',replyto:d.email,botcheck:''},d);
 const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(p)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok||j.success===false)throw new Error('send failed');return true;
}
function reveal(){const els=document.querySelectorAll('.rv');if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion:reduce)').matches){els.forEach(e=>e.classList.add('in'));return}
 const o=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');o.unobserve(x.target)}}),{threshold:.12});els.forEach(e=>o.observe(e))}
function enquiryInit(){
 const f=document.getElementById('enq');
 document.querySelectorAll('[data-way]').forEach(b=>b.addEventListener('click',()=>{const r=f&&f.querySelector(`input[name=way][value="${b.dataset.way}"]`);if(r)r.checked=true;
  document.getElementById('start').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});setTimeout(()=>f&&f.elements.name.focus({preventScroll:true}),400)}));
 if(!f)return;
 f.addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));let bad=null;
  [['name',v=>v.trim()],['email',v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.trim())],['about',v=>v.trim()],['goal',v=>v.trim()]].forEach(([k,ok])=>{const el=f.elements[k],good=!!ok(d[k]||'');el.setAttribute('aria-invalid',String(!good));document.getElementById('e-'+k).hidden=good;if(!good&&!bad)bad=el});
  if(bad){bad.focus();return}
  const b=f.querySelector('button[type=submit]');b.disabled=true;
  const ref=enqRef();d.ref=ref;let sent=false;try{sent=await sendEnquiry(d)}catch(x){b.disabled=false;document.getElementById('e-send').hidden=false;return}
  const body=enqText(d),mail=`mailto:${EMAIL}?subject=${encodeURIComponent('Enquiry '+ref+' from '+d.name)}&body=${encodeURIComponent(body)}`,w=document.getElementById('start').querySelector('.formwrap');
  w.innerHTML=sent?`<div class="done" tabindex="-1"><h2 style="margin:40px 0 20px">Thank you.</h2><p class="lede">We’ve received your enquiry. We’ll take some time to understand what you’re trying to achieve before coming back with the right approach.</p><p class="refline">Your reference is <strong>${ref}</strong>. Quote it if you write to us.</p><p class="pull" style="margin-top:32px">Good work starts with understanding.</p></div>`
  :`<div class="done" tabindex="-1"><h2 style="margin:40px 0 20px">One last step.</h2><p class="lede">Your enquiry is ready. Send it to ${EMAIL} so it reaches us. Your reference is <strong>${ref}</strong>.</p><p class="cta"><a class="btn" href="${mail}" target="_blank" rel="noopener">Open in email</a><button type="button" class="lnk" id="cp">Copy enquiry</button></p><pre class="draft" id="dr"></pre><p class="pull" style="margin-top:32px">Good work starts with understanding.</p></div>`;
  if(!sent){document.getElementById('dr').textContent=body;const c=document.getElementById('cp');c.addEventListener('click',()=>{(navigator.clipboard?navigator.clipboard.writeText(body):Promise.reject()).then(()=>c.textContent='Copied',()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('dr'));const s=getSelection();s.removeAllRanges();s.addRange(r);c.textContent='Text selected, press copy'})})}
  document.querySelector('.done').focus();});
}
R['begin']=R['work-with-us']=()=>({t:'Begin — Alexander Milambo',ovh:true,after:enquiryInit,h:`
<section class="bh" aria-labelledby="wh"><img src="${IM.begin.s}" alt="${IM.begin.a}" fetchpriority="high" decoding="async"><div class="bh-copy rv in"><p class="eyebrow">Begin</p><h1 id="wh" style="font-size:clamp(1.9rem,3.2vw,3.2rem);max-width:13ch">There are different ways to work together.</h1>
<p class="lede" style="margin-top:36px">Some projects begin with a clear brief. Others begin with a place, an idea or a problem that needs to be understood. We shape the engagement around what you’re trying to achieve.</p>
<div class="cta"><button type="button" class="btn" data-way="Not sure yet">Start a Project</button><a class="lnk" href="#/work" style="text-decoration:none">Explore Our Work →</a></div></div></section>
${WAYS.map(way).join('')}
<section class="sec cons" aria-labelledby="cs"><div class="two rv"><div class="a"><p class="eyebrow">Consultation</p><h2 id="cs" style="max-width:12ch">Or simply, let’s talk.</h2></div><div class="b"><p class="price" aria-label="100 US dollars">$100</p><p class="note" style="margin:-4px 0 20px">Three one-hour sessions · in person or online</p><p class="lede">For when you’re not ready for a project, partnership or residency, or your question sits outside all three. Three one-hour sessions, in person or online, to think it through together and leave with a clearer sense of direction.</p><button type="button" class="lnk" data-way="Consultation" style="margin-top:28px">Book a Consultation →</button><p class="note" style="margin-top:20px">Enquire below and we’ll arrange the times around you.</p></div></div></section>

<section class="sec" style="padding-top:0" aria-labelledby="pr"><h2 id="pr" style="margin-bottom:40px">How it unfolds</h2><ol class="proc rv">${STEPS.map((s,i)=>`<li><b>0${i+1}</b><span>${s[0]}</span><p style="margin:0">${s[1]}</p></li>`).join('')}</ol></section>

${area('more','Anything else we should know?')}
<div class="full2"><button type="submit" class="btn">Begin the Conversation</button><p class="err" id="e-send" role="alert" hidden style="margin-top:14px">Something went wrong. Please email ${EMAIL} directly.</p></div>
</form></div></section>`});

const main=document.getElementById('main');
function render(){
 const h=location.hash.replace(/^#\/?/,'').split('/');
 const v=h[0]==='work'&&h[1]?proj(h[1]):(R[h[0]]||R[''])();
 main.innerHTML=v.h;document.body.classList.toggle('home',!!v.home);document.body.classList.toggle('ovh',!!v.ovh);if(v.after)v.after();reveal();document.title=v.t;
